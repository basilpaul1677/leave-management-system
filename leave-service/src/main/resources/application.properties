# =========================================================
# APPLICATION
# =========================================================

spring.application.name=leave-service
server.port=8082


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/leave_management_employee
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

jwt.secret=LeaveManagementSystemSecretKeyForDevelopmentOnly123456789
jwt.expiration=86400000


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=when_authorized


# =========================================================
# SPRINGDOC / SWAGGER
# =========================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# MICROSERVICE URLs
# =========================================================

employee-service.url=http://localhost:8081
notification-service.url=http://localhost:8083